<section class="pagina">
  <div class="wrap pagina__grid pagina__grid--so">
    <div>
      <p class="rotulo">Blog</p>
      <h1>Artigos sobre direito imobiliário e empresarial.</h1>
      <p class="lead">Textos dos sócios sobre os temas que aparecem no dia a dia do escritório.</p>
    </div>
  </div>
</section>

<section class="sec sec--topo0">
  <div class="wrap">
    <div class="campo busca">
      <label for="busca">Buscar nos artigos</label>
      <input id="busca" type="search" placeholder="Ex.: distrato, locação, outorga" autocomplete="off">
    </div>
    <ul class="posts" style="margin-top:40px" data-posts="todos" data-tag="h2" data-slugs="{{slugs}}">
{{posts:todos}}
    </ul>
    <p class="blog-vazio" id="busca-vazia" role="status" hidden>Nenhum artigo encontrado. Tente outra palavra.</p>
  </div>
</section>

{{cta}}
